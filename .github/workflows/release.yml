name: Desktop Release Recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose validated build artifacts should be uploaded
        required: true
        default: v1.2.2
        type: string
      artifact_run_id:
        description: Original Desktop Release run with successful source and package checks
        required: true
        default: "35587092767"
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  recover:
    name: Upload verified artifacts to release draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the original release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify original build provenance and draft status
        shell: bash
        run: |
          set -euo pipefail
          node desktop/scripts/check-release-tag.mjs "$RELEASE_TAG"
          run_sha=$(gh api "repos/$GH_REPO/actions/runs/$ARTIFACT_RUN_ID" --jq .head_sha)
          test "$run_sha" = "$(git rev-parse HEAD)"
          gh api "repos/$GH_REPO/actions/runs/$ARTIFACT_RUN_ID/jobs?filter=latest&per_page=100" > original-jobs.json
          jq -e '[.jobs[] | select(.name == "Test release source" or .name == "macOS x64" or .name == "macOS arm64" or .name == "Windows x64")] | (length == 4 and all(.[]; .conclusion == "success"))' original-jobs.json
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          echo "Verified original build commit: $run_sha"

      - name: Download original release artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
          pattern: easy-stock-*
          path: release-assets
          merge-multiple: true

      - name: Verify update packages and prepare user downloads
        run: |
          node desktop/scripts/merge-mac-updater-metadata.mjs release-assets
          node desktop/scripts/verify-updater-artifacts.mjs release-assets latest-mac.yml latest.yml
          node desktop/scripts/prepare-publish-assets.mjs release-assets publish-assets "$RELEASE_TAG"

      - name: Generate SHA-256 checksums
        working-directory: publish-assets/github
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload and verify the existing release draft
        run: |
          bash desktop/scripts/publish-github-release.sh "$RELEASE_TAG" publish-assets/github ".github/release-notes/$RELEASE_TAG.md"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
