name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Test release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: node desktop/scripts/check-release-tag.mjs

      - name: Test backend and frontend
        run: npm test

      - name: Test desktop shell
        run: npm --workspace desktop test

  macos:
    name: macOS ${{ matrix.arch }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: x64
          - runner: macos-14-arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Build macOS release assets
        env:
          A_STOCK_DESKTOP_ARCH: ${{ matrix.arch }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm run release:mac

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: easy-stock-macos-${{ matrix.arch }}
          path: desktop/dist/release/*
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows release asset
        env:
          A_STOCK_DESKTOP_ARCH: x64
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm run release:windows

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: easy-stock-windows-x64
          path: desktop/dist/release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs:
      - quality
      - macos
      - windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: easy-stock-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "easy-stock $RELEASE_TAG" --notes-file ".github/release-notes/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "easy-stock $RELEASE_TAG" --notes-file ".github/release-notes/$RELEASE_TAG.md"
          fi
